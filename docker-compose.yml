services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: occuevroute-backend
    restart: unless-stopped
    ports:
      - "9000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./ML/Data:/app/ML/Data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: occuevroute-frontend
    restart: unless-stopped
    environment:
      BACKEND_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9090:80"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
